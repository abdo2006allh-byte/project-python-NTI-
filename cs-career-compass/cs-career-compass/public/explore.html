<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-en="Explore Fields" data-ar="استكشاف التخصصات">Explore Fields</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <div class="nav">
    <a class="brand" href="/">CS Career Compass</a>
    <div class="navlinks">
      <a class="btn" data-nav-link="/explore.html" href="/explore.html" data-en="Explore Fields" data-ar="استكشاف التخصصات">Explore Fields</a>
      <a class="btn" data-nav-link="/choose.html" href="/choose.html" data-en="Choose a Field" data-ar="اختر تخصصًا">Choose a Field</a>
      <a class="btn ai" data-nav-link="/career-match.html" href="/career-match.html" data-en="AI Career Fit" data-ar="فحص الملاءمة الوظيفية">AI Career Fit</a>
      <a class="btn lang" href="#" data-lang-toggle>English</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="section">
    <h1 data-en="Explore Fields" data-ar="استكشاف التخصصات">Explore Fields</h1>
    <p class="muted" data-en="Read a complete beginner-friendly overview for any field." data-ar="اقرأ شرحًا متكاملًا ومناسبًا للمبتدئ لأي تخصص.">Read a complete beginner-friendly overview for any field.</p>
    <div class="search">
      <input id="q" data-placeholder-en="Search fields..." data-placeholder-ar="ابحث عن تخصص..." placeholder="Search fields...">
      <button class="btn primary" id="searchBtn" data-en="Search" data-ar="بحث">Search</button>
    </div>
    <div class="grid" id="cards">
      <div class="loading" data-en="Loading fields..." data-ar="جاري تحميل التخصصات...">Loading fields...</div>
    </div>
  </section>
</main>

<footer class="wrap">CS Career Compass</footer>

<script src="/js/main.js"></script>
<script>
CC.initHeader();

let ALL_FIELDS = [];

function renderCards(fields) {
  const el = document.getElementById("cards");
  if (!fields.length) {
    el.innerHTML = `<p class="muted">${CC.t("No fields match your search.","لا توجد تخصصات مطابقة لبحثك.")}</p>`;
    return;
  }
  el.innerHTML = fields.map(f => `
    <a class="card" href="/field.html?id=${encodeURIComponent(f.id)}">
      <span class="tag">${CC.escapeHtml(CC.fieldName(f))}</span>
      <h3>${CC.escapeHtml(CC.fieldName(f))}</h3>
      <p class="muted">${CC.escapeHtml(CC.fieldDesc(f))}</p>
    </a>`).join("");
}

function applyFilter() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (!q) { renderCards(ALL_FIELDS); return; }
  const filtered = ALL_FIELDS.filter(f =>
    (f.name + " " + f.ar).toLowerCase().includes(q)
  );
  renderCards(filtered);
}

document.getElementById("searchBtn").addEventListener("click", applyFilter);
document.getElementById("q").addEventListener("keyup", (e) => { if (e.key === "Enter") applyFilter(); });

CC.fetchData().then(data => {
  ALL_FIELDS = data.fields;
  renderCards(ALL_FIELDS);
}).catch(() => {
  document.getElementById("cards").innerHTML =
    `<p class="muted">${CC.t("Could not load field data. Is the server running?","تعذّر تحميل بيانات التخصصات. هل السيرفر يعمل؟")}</p>`;
});
</script>
</body>
</html>
